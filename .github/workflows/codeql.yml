name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 19 * * 3"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
          - actions

    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: 执行 CodeQL 分析
        if: matrix.language != 'python'
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:${{ matrix.language }}

      - name: 执行 CodeQL 分析
        if: matrix.language == 'python'
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        env:
          # Load the repository-local path-validation model pack. The search
          # path is the pack's parent; the activated name must match qlpack.yml.
          # This adds a data-flow barrier without disabling any standard query.
          CODEQL_ACTION_EXTRA_OPTIONS: >-
            {"database":{"run-queries":[
            "--additional-packs=${{ github.workspace }}/.github/codeql",
            "--extension-packs=mhti/path-security-models"]}}
        with:
          category: /language:${{ matrix.language }}
