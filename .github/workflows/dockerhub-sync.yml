name: Sync Published Image to Docker Hub

on:
  workflow_dispatch:
    inputs:
      version:
        description: '已发布的正式版本号，不带 v'
        required: true
        default: '2.1.8'
      source_digest:
        description: 'GHCR 镜像的完整 sha256 摘要'
        required: true
      update_aliases:
        description: '同时更新主版本、主次版本及 latest（仅限最新正式版）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mhti-container-publish
  cancel-in-progress: false

env:
  SOURCE_IMAGE: ghcr.io/sfgawrgarf/mhti
  TARGET_IMAGE: docker.io/asdfvf2/mhti

jobs:
  sync:
    name: 同步已发布的双架构镜像
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_DIGEST: ${{ inputs.source_digest }}
      UPDATE_ALIASES: ${{ inputs.update_aliases }}
    steps:
      - name: 验证版本、摘要及发布授权
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '正式版本号格式无效' >&2; exit 1; }
          [[ "$SOURCE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo '镜像摘要格式无效' >&2; exit 1; }
          if [[ "$DOCKERHUB_USERNAME" != "asdfvf2" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo '请配置 DOCKERHUB_USERNAME=asdfvf2 和 DOCKERHUB_TOKEN' >&2
            exit 1
          fi
          gh api "repos/$GH_REPO/releases/tags/v$VERSION" > release.json
          jq -e '.draft == false and .prerelease == false' release.json
          if [[ "$UPDATE_ALIASES" == 'true' ]]; then
            LATEST_TAG="$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')"
            [[ "$LATEST_TAG" == "v$VERSION" ]] || { echo '仅最新正式版可更新浮动标签' >&2; exit 1; }
          fi

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: 验证 GHCR 镜像身份和平台
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$SOURCE_IMAGE:$VERSION" --format '{{json .Manifest}}' > source-manifest.json
          jq -e --arg digest "$SOURCE_DIGEST" '
            .digest == $digest and
            ([.manifests[].platform | .os + "/" + .architecture] | sort) == ["linux/amd64", "linux/arm64"]
          ' source-manifest.json

      - name: 安装镜像同步工具
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo

      - name: 登录 Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 同步完整镜像并验证摘要
        run: |
          set -euo pipefail
          TAGS=("$VERSION")
          if [[ "$UPDATE_ALIASES" == 'true' ]]; then
            TAGS+=("${VERSION%.*}" "${VERSION%%.*}" latest)
          fi
          for image_tag in "${TAGS[@]}"; do
            skopeo copy --all --preserve-digests --retry-times 3 \
              --authfile "$HOME/.docker/config.json" \
              "docker://$SOURCE_IMAGE@$SOURCE_DIGEST" "docker://$TARGET_IMAGE:$image_tag"
            docker buildx imagetools inspect "$TARGET_IMAGE:$image_tag" --format '{{json .Manifest}}' > target-manifest.json
            jq -e --arg digest "$SOURCE_DIGEST" '.digest == $digest' target-manifest.json
            printf '| `%s:%s` | `%s` |\n' "$TARGET_IMAGE" "$image_tag" "$SOURCE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          done
